site_name: ERP – openLCA Synchronisation Kit

theme:
  favicon: assets/images/favicon.ico
  logo: assets/images/logo.png
  name: material
  color_mode: dark
  features: 
    - navigation.path
    - navigation.indexes
    - navigation.tabs
    - content.code.copy
    - content.code.select

  palette:
  - media: '(prefers-color-scheme)'
    toggle: 
      icon: material/brightness-auto
      name: Switch to light mode

  - media: '(prefers-color-scheme: light)'
    scheme: default
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode

  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: indigo
    accent: blue
    toggle:
      icon: material/brightness-4
      name: Switch to light mode

markdown_extensions:
  - def_list
  - pymdownx.tasklist: 
      custom_checkbox: true
  - pymdownx.highlight: 
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences: 
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js

nav:
  - Home: index.md
  - Changelog: changelog.md
  - Adoption View:
      - Introduction: adoption-view/introduction.md
      - Use Case: adoption-view/use-case.md
      - Customer Journey: adoption-view/customer-journey.md
      - Semantic Models: adoption-view/semantic-models.md
      - Additional Resources: adoption-view/additional-resources.md
  - Development View:
      - Architecture Overview: development-view/architecture-overview.md
      - Data Retrieval Flow: development-view/data-retrieval-flow.md
  - Operation View:
      - Configuration Guide: operation-view/configuration-guide.md

